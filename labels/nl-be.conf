# nl-be overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through nl-be, then nl, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 55 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.could_not_delete = Verwijderen mislukt
errors.missing_setting_name = Ontbrekende instellingsnaam
errors.missing_setting_value = Ontbrekende instellingswaarde
errors.nothing_to_update = Niets bij te werken
errors.name_cannot_be_empty = Naam kan niet leeg zijn
errors.missing_ceremony_or_credential = Ontbrekende ceremonie of credential
errors.reauthentication_required = Herauthenticatie is mislukt of vervallen. Probeer het opnieuw
errors.method_last_factor = Je moet minstens één manier om aan te melden behouden
errors.method_not_configured = Stel deze methode in voordat je ze inschakelt
errors.too_many_codes = Te veel aanmeldpogingen. Probeer het later opnieuw.
errors.unable_to_send_code = Kan aanmeld-e-mail niet verzenden
